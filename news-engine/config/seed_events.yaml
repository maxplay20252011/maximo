# Corpus semilla: los 26 episodios de §6.1.
#
# SOBRE LAS HORAS. `hora_utc` no pretende precision al minuto. Esta elegida para
# que caiga del lado correcto del cierre de mercado, que es lo unico que cambia
# el calculo: un evento anterior al cierre del dia D se mide desde el cierre de
# D-1 y reacciona en D; uno posterior al cierre de D se mide desde el cierre de D
# y reacciona en D+1. Los casos donde eso importa (Brexit, eleccion 2016,
# downgrade de 2011) estan marcados con `post_cierre: true`.
#
# Un episodio con la hora mal puesta mide la reaccion de un dia equivocado. Si
# vas a refinar algo de este archivo, refina las horas antes que los titulares.

